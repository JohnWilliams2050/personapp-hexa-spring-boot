name: personapp

# Shared configuration for both input adapters (REST and CLI).
# Environment variables override application.properties (Spring relaxed binding),
# so the same image runs locally, in Docker, or anywhere else without rebuilding.
x-app-environment: &app-environment
  SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/persona_db
  SPRING_MONGODB_HOST: mongodb
  SPRING_MONGODB_PORT: "27017"

x-app-depends-on: &app-depends-on
  mariadb:
    condition: service_healthy
  mongodb:
    condition: service_healthy

services:
  mariadb:
    image: mariadb:12.3.3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "3307:3306"            # README: MariaDB on port 3307 (host side)
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/persona_ddl_maria.sql:/docker-entrypoint-initdb.d/01-persona_ddl_maria.sql:ro
      - ./scripts/persona_dml_maria.sql:/docker-entrypoint-initdb.d/02-persona_dml_maria.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:9.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"          # README: MongoDB on port 27017
    volumes:
      - mongo_data:/data/db
      - ./scripts:/seed:ro
      - ./docker/mongo-init/01-seed.sh:/docker-entrypoint-initdb.d/01-seed.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rest:
    build:
      context: .
      target: rest
    image: personapp-rest:0.0.1
    environment: *app-environment
    depends_on: *app-depends-on
    ports:
      - "3000:3000"            # README: REST + Swagger on port 3000
    restart: unless-stopped

  cli:
    build:
      context: .
      target: cli
    image: personapp-cli:0.0.1
    environment: *app-environment
    depends_on: *app-depends-on
    stdin_open: true           # the CLI reads the menu options from the keyboard
    tty: true
    profiles: ["cli"]          # not started by "up"; run it with "docker compose run --rm cli"

volumes:
  mariadb_data:
  mongo_data: